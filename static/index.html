<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d0d1a">
<title>⚡ Anime Video Upscaler</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0d0d1a;--bg2:#13131f;--bg3:#1a1a2e;--accent:#3a86ff;--accent2:#6c63ff;--green:#2ecc71;--red:#e74c3c;--text:#e0e0ff;--text2:#8888aa;--border:#2a2a3e}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;padding:20px 16px 40px}

/* header */
.header{width:100%;max-width:600px;display:flex;align-items:center;gap:12px;padding:16px 0 24px}
.logo{font-size:32px}
.title{font-size:22px;font-weight:800;letter-spacing:.5px}
.badge{background:var(--green);color:#000;font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px}

/* drop zone */
.dropzone{width:100%;max-width:600px;border:2px dashed var(--border);border-radius:20px;padding:40px 20px;text-align:center;cursor:pointer;transition:all .25s;position:relative;background:var(--bg2)}
.dropzone:hover,.dropzone.drag{border-color:var(--accent);background:#1a1a3a;box-shadow:0 0 30px #3a86ff22}
.dropzone .icon{font-size:52px;margin-bottom:12px}
.dropzone .label{font-size:16px;font-weight:600;color:var(--text);margin-bottom:6px}
.dropzone .sub{font-size:12px;color:var(--text2)}
.dropzone input{position:absolute;inset:0;opacity:0;cursor:pointer}
.file-info{margin-top:14px;padding:12px 16px;background:var(--bg3);border-radius:12px;font-size:13px;color:var(--text2);display:none}
.file-info.show{display:block}
.file-name{font-weight:700;color:var(--text);font-size:14px;margin-bottom:4px}

/* settings */
.settings{width:100%;max-width:600px;margin-top:16px;background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:20px}
.settings h3{font-size:14px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px}
.setting-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.setting-label{font-size:14px;font-weight:600}
.setting-sub{font-size:11px;color:var(--text2);margin-top:2px}

/* toggle */
.toggle{position:relative;width:52px;height:28px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-track{position:absolute;inset:0;background:var(--bg3);border-radius:14px;border:1px solid var(--border);transition:.2s;cursor:pointer}
.toggle-track::after{content:'';position:absolute;left:4px;top:4px;width:18px;height:18px;background:var(--text2);border-radius:50%;transition:.2s}
.toggle input:checked+.toggle-track{background:var(--accent);border-color:var(--accent)}
.toggle input:checked+.toggle-track::after{left:28px;background:#fff}

/* scale buttons */
.scale-btns{display:flex;gap:8px}
.scale-btn{padding:6px 20px;border-radius:10px;font-size:14px;font-weight:700;border:1px solid var(--border);background:var(--bg3);color:var(--text2);cursor:pointer;transition:.2s}
.scale-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* start button */
.btn-start{width:100%;max-width:600px;margin-top:16px;height:56px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:16px;color:#fff;font-size:17px;font-weight:800;cursor:pointer;transition:all .2s;letter-spacing:.3px}
.btn-start:hover{transform:translateY(-2px);box-shadow:0 8px 24px #3a86ff44}
.btn-start:active{transform:scale(.97)}
.btn-start:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}

/* progress */
.progress-card{width:100%;max-width:600px;margin-top:16px;background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:20px;display:none}
.progress-card.show{display:block}
.progress-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.progress-title{font-size:15px;font-weight:700}
.progress-pct{font-size:20px;font-weight:800;color:var(--accent)}
.progress-bar{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;margin-bottom:10px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px;transition:width .5s ease;width:0%}
.progress-msg{font-size:12px;color:var(--text2);font-family:Consolas,monospace}
.progress-stats{display:flex;gap:16px;margin-top:12px}
.stat{background:var(--bg3);border-radius:10px;padding:8px 14px;flex:1;text-align:center}
.stat-val{font-size:16px;font-weight:700;color:var(--text)}
.stat-lbl{font-size:10px;color:var(--text2);margin-top:2px}

/* download */
.download-card{width:100%;max-width:600px;margin-top:16px;background:#0d1a0d;border:1px solid #1a3a1a;border-radius:20px;padding:20px;text-align:center;display:none}
.download-card.show{display:block}
.download-card .icon{font-size:48px;margin-bottom:10px}
.download-card h3{font-size:18px;font-weight:800;color:var(--green);margin-bottom:6px}
.download-card p{font-size:13px;color:var(--text2);margin-bottom:16px}
.btn-download{display:inline-block;padding:14px 36px;background:var(--green);color:#000;font-size:15px;font-weight:800;border-radius:14px;text-decoration:none;cursor:pointer;border:none;transition:.2s}
.btn-download:hover{transform:translateY(-2px);box-shadow:0 8px 20px #2ecc7144}
.btn-new{margin-left:12px;padding:14px 24px;background:var(--bg3);color:var(--text2);font-size:14px;font-weight:600;border-radius:14px;border:1px solid var(--border);cursor:pointer}

/* error */
.error-card{width:100%;max-width:600px;margin-top:16px;background:#1a0d0d;border:1px solid #3a1a1a;border-radius:20px;padding:16px;display:none;font-size:13px;color:var(--red)}
.error-card.show{display:block}
</style>
</head>
<body>

<div class="header">
  <span class="logo">⚡</span>
  <div>
    <div class="title">Anime Video Upscaler</div>
  </div>
  <span class="badge">FREE</span>
</div>

<!-- Drop Zone -->
<div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
  <div class="icon">📂</div>
  <div class="label">Click sau trage videoul aici</div>
  <div class="sub">MP4, MKV, AVI, MOV, WEBM</div>
  <input type="file" id="fileInput" accept="video/*" onchange="onFileSelect(this)">
</div>
<div class="file-info" id="fileInfo">
  <div class="file-name" id="fileName"></div>
  <div id="fileMeta"></div>
</div>

<!-- Settings -->
<div class="settings">
  <h3>Setări</h3>
  <div class="setting-row">
    <div>
      <div class="setting-label">⚡ Force 1080p output</div>
      <div class="setting-sub">Resize→540p, upscale×2 = 1080p  •  4-8× mai rapid</div>
    </div>
    <label class="toggle">
      <input type="checkbox" id="force1080" checked>
      <div class="toggle-track"></div>
    </label>
  </div>
  <div class="setting-row">
    <div>
      <div class="setting-label">📐 Scale factor</div>
      <div class="setting-sub">×2 recomandat cu Force 1080p</div>
    </div>
    <div class="scale-btns">
      <button class="scale-btn active" onclick="setScale(this,2)">×2</button>
      <button class="scale-btn" onclick="setScale(this,4)">×4</button>
    </div>
  </div>
</div>

<!-- Start Button -->
<button class="btn-start" id="btnStart" disabled onclick="startUpscale()">
  ▶  Start Upscale
</button>

<!-- Progress -->
<div class="progress-card" id="progressCard">
  <div class="progress-header">
    <div class="progress-title">Procesare video...</div>
    <div class="progress-pct" id="progressPct">0%</div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-msg" id="progressMsg">Inițializare...</div>
  <div class="progress-stats">
    <div class="stat"><div class="stat-val" id="statFrames">—</div><div class="stat-lbl">Frames</div></div>
    <div class="stat"><div class="stat-val" id="statStatus">—</div><div class="stat-lbl">Status</div></div>
  </div>
</div>

<!-- Download -->
<div class="download-card" id="downloadCard">
  <div class="icon">🎉</div>
  <h3>Video upscalat!</h3>
  <p id="downloadInfo">Gata de descărcat</p>
  <button class="btn-download" id="btnDownload" onclick="downloadResult()">
    ⬇  Descarcă video
  </button>
  <button class="btn-new" onclick="resetUI()">+ Video nou</button>
</div>

<!-- Error -->
<div class="error-card" id="errorCard"></div>

<script>
let selectedFile = null;
let currentScale = 2;
let currentJobId = null;
let pollInterval = null;

// drag & drop
const dz = document.getElementById('dropzone');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
dz.addEventListener('drop', e => {
  e.preventDefault(); dz.classList.remove('drag');
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith('video/')) setFile(f);
});

function onFileSelect(input) {
  if (input.files[0]) setFile(input.files[0]);
}

function setFile(f) {
  selectedFile = f;
  document.getElementById('fileName').textContent = f.name;
  document.getElementById('fileMeta').textContent =
    (f.size / 1_048_576).toFixed(1) + ' MB';
  document.getElementById('fileInfo').classList.add('show');
  document.getElementById('btnStart').disabled = false;
  document.getElementById('dropzone').querySelector('.label').textContent = f.name.length > 30 ? f.name.slice(0,28)+'…' : f.name;
  document.getElementById('dropzone').querySelector('.icon').textContent = '🎬';
}

function setScale(btn, s) {
  currentScale = s;
  document.querySelectorAll('.scale-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

async function startUpscale() {
  if (!selectedFile) return;

  document.getElementById('btnStart').disabled = true;
  document.getElementById('progressCard').classList.add('show');
  document.getElementById('downloadCard').classList.remove('show');
  document.getElementById('errorCard').classList.remove('show');

  const form = new FormData();
  form.append('video', selectedFile);
  form.append('scale', currentScale);
  form.append('force1080', document.getElementById('force1080').checked);

  try {
    const resp = await fetch('/upload', { method: 'POST', body: form });
    const data = await resp.json();
    if (data.error) throw new Error(data.error);
    currentJobId = data.job_id;
    startPolling();
  } catch(e) {
    showError('Upload eroare: ' + e.message);
    document.getElementById('btnStart').disabled = false;
  }
}

function startPolling() {
  pollInterval = setInterval(async () => {
    try {
      const r = await fetch('/status/' + currentJobId);
      const d = await r.json();
      updateProgress(d);
      if (d.status === 'done') {
        clearInterval(pollInterval);
        showDownload(d);
      } else if (d.status === 'error') {
        clearInterval(pollInterval);
        showError(d.message);
        document.getElementById('btnStart').disabled = false;
      }
    } catch(e) {}
  }, 1000);
}

function updateProgress(d) {
  const pct = d.progress || 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressMsg').textContent = d.message || '';
  document.getElementById('statFrames').textContent =
    d.n_frames ? (d.done || 0) + '/' + d.n_frames : '—';
  document.getElementById('statStatus').textContent = d.status || '—';
}

function showDownload(d) {
  document.getElementById('progressCard').classList.remove('show');
  document.getElementById('downloadCard').classList.add('show');
  const mb = d.out_size ? (d.out_size / 1_048_576).toFixed(1) + ' MB' : '';
  document.getElementById('downloadInfo').textContent =
    `Video upscalat cu succes! ${mb}`;
}

function downloadResult() {
  window.location.href = '/download/' + currentJobId;
}

function showError(msg) {
  const el = document.getElementById('errorCard');
  el.textContent = msg;
  el.classList.add('show');
  document.getElementById('progressCard').classList.remove('show');
}

function resetUI() {
  selectedFile = null;
  currentJobId = null;
  if (pollInterval) clearInterval(pollInterval);
  document.getElementById('downloadCard').classList.remove('show');
  document.getElementById('progressCard').classList.remove('show');
  document.getElementById('errorCard').classList.remove('show');
  document.getElementById('fileInfo').classList.remove('show');
  document.getElementById('btnStart').disabled = true;
  document.getElementById('dropzone').querySelector('.label').textContent = 'Click sau trage videoul aici';
  document.getElementById('dropzone').querySelector('.icon').textContent = '📂';
  document.getElementById('fileInput').value = '';
}
</script>
</body>
</html>
